<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compound Interest Visualizer</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: system-ui, sans-serif;
  background: #fff;
  color: #111;
  padding: 1.5rem;
  max-width: 680px;
  margin: 0 auto;
}

canvas {
  display: block;
  width: 100%;
  touch-action: none;
  border-radius: 8px;
  border: 0.5px solid rgba(0,0,0,0.15);
}

#canvas-wrap { position: relative; margin: 1rem 0 0.5rem; }

#legend-overlay {
  position: absolute;
  top: 18px; left: 64px;
  background: rgba(255,255,255,0.92);
  border: 0.5px solid rgba(0,0,0,0.18);
  border-radius: 8px;
  padding: 7px 12px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  pointer-events: none;
}

.leg-row { display: flex; align-items: center; gap: 8px; }

.leg-line-solid {
  width: 28px; height: 3px;
  flex-shrink: 0;
  border-radius: 2px;
  background: #185FA5;
}

.leg-line-dashed {
  width: 28px; height: 0;
  flex-shrink: 0;
  border-top: 2.5px dashed #C0392B;
}

.leg-label { font-size: 14px; line-height: 1; }

.slider-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 0.75rem;
}

.slider-label {
  font-size: 13px;
  width: 10ch;
  flex-shrink: 0;
  white-space: nowrap;
  text-align: right;
  color: #555;
}

.slider-val {
  font-size: 13px;
  width: 4ch;
  flex-shrink: 0;
  text-align: left;
  font-weight: 500;
}

input[type=range] {
  -webkit-appearance: none;
  appearance: none;
  height: 4px;
  background: #ccc;
  border-radius: 2px;
  outline: none;
  cursor: pointer;
  flex: 1;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: #185FA5;
  border: none;
  cursor: pointer;
}
input[type=range]::-moz-range-thumb {
  width: 16px; height: 16px;
  border-radius: 50%;
  background: #185FA5;
  border: none;
  cursor: pointer;
}

/* the n slider sits in a column: don't let the row rule (flex: 1) stretch it tall */
#sl-n { flex: none; }

#n-stops {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: #999;
  padding: 0 1px;
  margin-top: 2px;
  flex: 1;
}

#formula-box {
  margin: 1rem 0 0.5rem;
  padding: 0.7rem 1.1rem;
  background: #f6f8fc;
  border-radius: 8px;
  border: 0.5px solid #d8e2f0;
  min-height: 3rem;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 0.35rem;
}

#formula-description {
  font-size: 13px;
  color: #666;
  text-align: center;
  font-style: italic;
}

#formula-result {
  font-size: 13px;
  color: #666;
  text-align: center;
}

#hint {
  margin-top: 0.5rem;
  font-size: 11px;
  color: #999;
  text-align: center;
}

/* ── dark mode ── */
@media (prefers-color-scheme: dark) {
  body { background: #1a1a1a; color: #eee; }

  canvas { border-color: rgba(255,255,255,0.15); }

  #legend-overlay {
    background: rgba(30,30,30,0.92);
    border-color: rgba(255,255,255,0.15);
  }

  .leg-line-solid { background: #85B7EB; }
  .leg-line-dashed { border-top-color: #F09595; }

  .slider-label { color: #aaa; }
  input[type=range] { background: #444; }
  input[type=range]::-webkit-slider-thumb { background: #85B7EB; }
  input[type=range]::-moz-range-thumb     { background: #85B7EB; }

  #n-stops { color: #666; }

  #formula-box { background: #242424; border-color: #333; }
  #formula-box .katex { color: #eee; }
  #formula-description { color: #999; }
  #hint { color: #666; }
  #tooltip { background: rgba(30,30,30,0.95) !important; border-color: rgba(255,255,255,0.15) !important; color: #eee !important; }
}
</style>
</head>
<body>

<div id="formula-box">
  <span id="formula-math"></span>
  <span id="formula-description"></span>
</div>

<div class="slider-row">
  <span class="slider-label" id="label-r"></span>
  <input type="range" id="sl-r" min="1" max="20" step="0.1" value="5" style="flex:1">
  <span class="slider-val" id="val-r"></span>
</div>

<div class="slider-row" style="align-items:flex-start;padding-top:2px">
  <span class="slider-label" id="label-n" style="padding-top:6px"></span>
  <div style="display:flex;flex-direction:column;flex:1;gap:0">
    <input type="range" id="sl-n" min="0" max="7" step="1" value="5" style="width:100%">
    <div id="n-stops">
      <span>2yr</span><span>1yr</span><span>6mo</span><span>3mo</span><span>2mo</span><span>mo</span><span>wk</span><span>day</span>
    </div>
  </div>
  <span class="slider-val" id="val-n" style="padding-top:4px"></span>
</div>

<div id="canvas-wrap">
  <canvas id="plot"></canvas>
  <div id="legend-overlay">
    <div class="leg-row">
      <div class="leg-line-solid"></div>
      <span class="leg-label" id="leg-discrete"></span>
    </div>
    <div class="leg-row">
      <div class="leg-line-dashed"></div>
      <span class="leg-label" id="leg-continuous"></span>
    </div>
  </div>
  <div id="tooltip" style="position:absolute;display:none;pointer-events:none;background:rgba(255,255,255,0.95);border:0.5px solid rgba(0,0,0,0.18);border-radius:7px;padding:5px 10px;font-size:13px;color:#111;white-space:nowrap;"></div>
</div>

<div id="hint">Hover, or hold a finger or pen on the graph, to read the balance &nbsp;·&nbsp; Scroll or pinch to zoom the time axis &nbsp;·&nbsp; Double-click to reset view</div>

<script>
const A0 = 100;
const N_VALUES = [0.5, 1, 2, 4, 6, 12, 52, 365];
const N_LABELS = ['½', '1', '2', '4', '6', '12', '52', '365'];
const N_FREQ   = ['biennially','annually','biannually','quarterly','every 2 months','monthly','weekly','daily'];

let r    = 0.05;
let nIdx = 5;
let n    = N_VALUES[nIdx];

const MARGIN_LEFT   = 56;
const MARGIN_BOTTOM = 28;
const MARGIN_TOP    = 14;
const MARGIN_RIGHT  = 14;

let xMax = 10;
const DEFAULT_XMAX = 10;

const canvas = document.getElementById('plot');
const ctx    = canvas.getContext('2d');

// sharp on hi-DPI screens: drawing is done in CSS px (CW × CH)
let CW = 0, CH = 0;
function setCanvasSize() {
  CW = document.getElementById('canvas-wrap').clientWidth;
  CH = Math.round(CW * 0.62);
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = Math.round(CW * dpr);
  canvas.height = Math.round(CH * dpr);
  canvas.style.height = CH + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function plotW() { return CW - MARGIN_LEFT - MARGIN_RIGHT; }
function plotH() { return CH - MARGIN_TOP  - MARGIN_BOTTOM; }

function yMaxContinuous() {
  return Math.max(A0 * Math.exp(r * xMax) * 1.12, 200);
}
function toCanvas(mx, my) {
  const yMax = yMaxContinuous();
  return [
    MARGIN_LEFT + (mx / xMax) * plotW(),
    MARGIN_TOP  + (1 - my / yMax) * plotH(),
  ];
}

function getColors() {
  const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  return {
    bg:         dark ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.02)',
    grid:       dark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.07)',
    axis:       dark ? 'rgba(255,255,255,0.30)' : 'rgba(0,0,0,0.40)',
    tick:       dark ? 'rgba(255,255,255,0.45)' : 'rgba(0,0,0,0.45)',
    curve:      dark ? '#85B7EB' : '#185FA5',
    continuous: dark ? '#F09595' : '#C0392B',
  };
}

function niceTick(span, targetCount) {
  const rough = span / targetCount;
  const mag   = Math.pow(10, Math.floor(Math.log10(rough)));
  for (const m of [1, 2, 5, 10]) if (mag * m >= rough) return mag * m;
  return mag * 10;
}
function fmtTick(v) {
  if (Math.abs(v) < 1e-9) return '0';
  const rd = Math.round(v * 1000) / 1000;
  return Number.isInteger(rd) ? String(Math.round(rd)) : rd.toPrecision(3).replace(/\.?0+$/, '');
}

let hoverT = null; // current mouse t value, or null if outside plot

function draw() {
  const W = CW, H = CH;
  const C = getColors();
  const PW = plotW(), PH = plotH();
  const yMax = yMaxContinuous();

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);

  const xTick = niceTick(xMax, 7);
  const yTick = niceTick(yMax, 6);

  ctx.strokeStyle = C.grid; ctx.lineWidth = 0.5;
  for (let x = xTick; x <= xMax + 1e-9; x += xTick) {
    const [px] = toCanvas(x, 0);
    ctx.beginPath(); ctx.moveTo(px, MARGIN_TOP); ctx.lineTo(px, MARGIN_TOP + PH); ctx.stroke();
  }
  for (let y = yTick; y <= yMax + 1e-9; y += yTick) {
    const [, py] = toCanvas(0, y);
    ctx.beginPath(); ctx.moveTo(MARGIN_LEFT, py); ctx.lineTo(MARGIN_LEFT + PW, py); ctx.stroke();
  }

  ctx.strokeStyle = C.axis; ctx.lineWidth = 2;
  const [, yBottom] = toCanvas(0, 0);
  const [, yTop]    = toCanvas(0, yMax);
  ctx.beginPath(); ctx.moveTo(MARGIN_LEFT, yBottom); ctx.lineTo(MARGIN_LEFT + PW, yBottom); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(MARGIN_LEFT, yTop);    ctx.lineTo(MARGIN_LEFT, yBottom); ctx.stroke();

  ctx.fillStyle = C.tick; ctx.font = '12px system-ui,sans-serif';
  ctx.textAlign = 'center';
  for (let x = xTick; x <= xMax + 1e-9; x += xTick) {
    const [px] = toCanvas(x, 0);
    ctx.fillText(fmtTick(x), px, MARGIN_TOP + PH + 18);
  }
  ctx.textAlign = 'right';
  for (let y = 0; y <= yMax + 1e-9; y += yTick) {
    const [, py] = toCanvas(0, y);
    ctx.fillText(fmtTick(y), MARGIN_LEFT - 7, py + 4);
  }

  const steps = Math.ceil(PW * 2);
  ctx.save();
  ctx.beginPath(); ctx.rect(MARGIN_LEFT, MARGIN_TOP, PW, PH); ctx.clip();

  /* continuous compounding envelope */
  ctx.strokeStyle = C.continuous; ctx.lineWidth = 2.2; ctx.setLineDash([6, 5]);
  let pd = false;
  for (let i = 0; i <= steps; i++) {
    const t  = (i / steps) * xMax;
    const my = A0 * Math.exp(r * t);
    const [px, py] = toCanvas(t, my);
    if (!pd) { ctx.beginPath(); ctx.moveTo(px, py); pd = true; } else ctx.lineTo(px, py);
  }
  if (pd) ctx.stroke();
  ctx.setLineDash([]);

  /* discrete compounding curve */
  ctx.strokeStyle = C.curve; ctx.lineWidth = 3; ctx.lineJoin = 'round';
  let penDown = false;
  for (let i = 0; i <= steps; i++) {
    const t  = (i / steps) * xMax;
    const my = A0 * Math.pow(1 + r / n, Math.floor(t * n));
    if (!isFinite(my)) { if (penDown) { ctx.stroke(); penDown = false; } continue; }
    const [px, py] = toCanvas(t, my);
    if (!penDown) { ctx.beginPath(); ctx.moveTo(px, py); penDown = true; }
    else ctx.lineTo(px, py);
  }
  if (penDown) ctx.stroke();

  /* hover marker */
  if (hoverT !== null && hoverT >= 0 && hoverT <= xMax) {
    const hY = A0 * Math.pow(1 + r / n, Math.floor(hoverT * n));
    const [hpx, hpy] = toCanvas(hoverT, hY);
    const [, hpyBottom] = toCanvas(hoverT, 0);
    const [hpxLeft]     = toCanvas(0, hY);

    /* vertical + horizontal dashed guide lines */
    ctx.strokeStyle = 'rgba(100,100,100,0.35)'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(hpx, hpyBottom); ctx.lineTo(hpx, hpy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(hpxLeft, hpy);   ctx.lineTo(hpx, hpy); ctx.stroke();
    ctx.setLineDash([]);

    /* dot on curve */
    ctx.beginPath(); ctx.arc(hpx, hpy, 5, 0, 2 * Math.PI);
    ctx.fillStyle = C.curve; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
  }

  ctx.restore();
}

function rk(el, tex, display) {
  if (!el) return;
  katex.render(tex, el, { displayMode: !!display, throwOnError: false });
}
function fmt(v) {
  const rd = Math.round(v * 100) / 100;
  if (Number.isInteger(rd)) return String(Math.round(rd));
  return rd.toFixed(2).replace(/\.?0+$/, '');
}

function updateKatex() {
  const rPct  = r * 100;
  const rStr  = fmt(rPct);
  const nDisp = n < 1 ? '\\tfrac{1}{2}' : String(Math.round(n));
  const rFrac = fmt(r);
  const tex   = `A(t) = 100\\,\\left(1 + \\dfrac{${rFrac}}{${nDisp}}\\right)^{\\lfloor t \\cdot ${nDisp} \\rfloor}`;
  rk(document.getElementById('formula-math'), tex, true);

  const freq  = N_FREQ[nIdx];
  document.getElementById('formula-description').textContent =
    `Compounding ${freq} at ${rStr}%`;

  rk(document.getElementById('label-r'), `r = ${rStr}\\%`, false);
  document.getElementById('val-r').textContent = rStr + '%';
  rk(document.getElementById('label-n'), `n`, false);
  document.getElementById('val-n').textContent = N_LABELS[nIdx];

  const rVal = fmt(r);
  rk(document.getElementById('leg-discrete'),   `A(t)`, false);
  rk(document.getElementById('leg-continuous'), `100\\,e^{${rVal}\\,t}`, false);
}

/* ── readout: "$100 → $… after … years" at the pointer's time ──
   Shown while a mouse hovers, and while a finger or pen is held on the graph
   (smartboards cannot hover), placed higher for touch so the hand does not cover it. */
const tooltip = document.getElementById('tooltip');

function showReadout(px, clientX, clientY, kind) {
  const PW = plotW();
  if (px < MARGIN_LEFT || px > MARGIN_LEFT + PW) { hideReadout(); return; }
  hoverT = ((px - MARGIN_LEFT) / PW) * xMax;
  const hY = A0 * Math.pow(1 + r / n, Math.floor(hoverT * n));
  tooltip.textContent = `$${fmt(A0)} → $${hY.toFixed(2)} after ${hoverT.toFixed(2)} years`;

  const wrap = canvas.parentElement.getBoundingClientRect();
  const lift = kind === 'mouse' ? 36 : 84;
  let tipX = clientX - wrap.left + 14;
  const tipY = Math.max(0, clientY - wrap.top - lift);
  tooltip.style.display = 'block';
  const tipW = tooltip.offsetWidth;
  if (tipX + tipW > wrap.width - 4) tipX = clientX - wrap.left - tipW - 14;    // flip left near the edge
  tooltip.style.left = Math.max(0, tipX) + 'px';
  tooltip.style.top  = tipY + 'px';
  draw();
}
function hideReadout() {
  if (hoverT === null && tooltip.style.display === 'none') return;
  hoverT = null;
  tooltip.style.display = 'none';
  draw();
}

/* ── pointer handling (same safeguards as the other explorers' graphing core) ──
   • the page keeps its own list of pointers that are down; when nothing is in progress any new
     press starts fresh, even if the board still thinks a phantom finger is down
   • two-finger pinch (zooms the time axis) only from a clean start: 2nd finger within
     PINCH_WINDOW ms of the 1st, PINCH_MIN_GAP px away, before the 1st has moved
   • a pinch ends for good when either finger lifts; pointers silent for TAKEOVER_MS give way to
     a new press; a silent pinch times out; a pen beats fingers */
const PINCH_WINDOW = 350, PINCH_MIN_GAP = 40, LEAD_STILL = 12, PINCH_DEADBAND = 10;
const TAKEOVER_MS = 1500, PINCH_TIMEOUT = 3000, PEN_RECENT = 1500;
const XMAX_MIN = 1, XMAX_MAX = 100;               // years shown
const pointers = new Map();   // pointerId → { type, x, y, x0, y0, t0, t }
let lead = null, pinch = null;
const now = () => performance.now();
const ptPos = e => { const rc = canvas.getBoundingClientRect(); return [e.clientX - rc.left, e.clientY - rc.top]; };
const busyIds = () => pinch ? [pinch.a, pinch.b] : lead !== null ? [lead] : [];
function silence(t) {
  const ts = busyIds().map(id => pointers.has(id) ? pointers.get(id).t : -Infinity);
  return ts.length ? t - Math.max(...ts) : Infinity;
}
const penActive = t => [...pointers.values()].some(p => p.type === 'pen' && t - p.t < PEN_RECENT);
function capture(id) { try { canvas.setPointerCapture(id); } catch (err) { /* optional */ } }
function resetInteraction() { lead = null; pinch = null; }

function tryPinch(id, t) {
  if (pinch || lead === null) return;
  const A = pointers.get(lead), B = pointers.get(id);
  if (!A || A.type !== 'touch' || B.type !== 'touch') return;
  if (t - A.t0 > PINCH_WINDOW || Math.hypot(A.x - A.x0, A.y - A.y0) > LEAD_STILL) return;
  if (Math.hypot(A.x - B.x, A.y - B.y) < PINCH_MIN_GAP) return;
  pinch = { a: lead, b: id, live: false };
  rebasePinch();
  lead = null;
  capture(id);
  hideReadout();
}
function pinchDist() {
  const A = pointers.get(pinch.a), B = pointers.get(pinch.b);
  return Math.max(10, Math.hypot(A.x - B.x, A.y - B.y));
}
function rebasePinch() { pinch.d0 = pinchDist(); pinch.x0 = xMax; }
function pinchMove() {
  const d = pinchDist();
  if (!pinch.live) {
    if (Math.abs(d - pinch.d0) < PINCH_DEADBAND) return;
    pinch.live = true; rebasePinch(); return;
  }
  xMax = Math.min(XMAX_MAX, Math.max(XMAX_MIN, pinch.x0 * pinch.d0 / d));   // fingers apart → fewer years
  updateKatex(); draw();
}

canvas.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const [px, py] = ptPos(e), t = now();
  if (e.isPrimary && e.pointerType !== 'mouse')
    for (const [id, p] of pointers) if (p.type === e.pointerType && id !== e.pointerId) pointers.delete(id);
  pointers.set(e.pointerId, { type: e.pointerType, x: px, y: py, x0: px, y0: py, t0: t, t });
  if (busyIds().length) {
    const leadP = lead !== null ? pointers.get(lead) : null;
    if (e.pointerType === 'pen' && !(leadP && leadP.type === 'pen')) resetInteraction();
    else if (silence(t) > TAKEOVER_MS) resetInteraction();
    else { tryPinch(e.pointerId, t); return; }
  }
  if (e.pointerType === 'touch' && penActive(t)) return;
  lead = e.pointerId;
  capture(e.pointerId);
  showReadout(px, e.clientX, e.clientY, e.pointerType);
});

canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  const [px, py] = ptPos(e);
  if (!p) {                                          // a hovering mouse / pen
    if (!busyIds().length && e.pointerType !== 'touch') showReadout(px, e.clientX, e.clientY, 'mouse');
    return;
  }
  p.x = px; p.y = py; p.t = now();
  if (pinch) { if (e.pointerId === pinch.a || e.pointerId === pinch.b) pinchMove(); return; }
  if (e.pointerId === lead) showReadout(px, e.clientX, e.clientY, e.pointerType);
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  const involved = e.pointerId === lead || (pinch && (e.pointerId === pinch.a || e.pointerId === pinch.b));
  if (!involved) return;
  resetInteraction();
  if (e.pointerType !== 'mouse') hideReadout();
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('lostpointercapture', endPointer);
canvas.addEventListener('pointerleave', e => { if (!busyIds().length) hideReadout(); });
window.addEventListener('blur', () => { pointers.clear(); resetInteraction(); hideReadout(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { pointers.clear(); resetInteraction(); hideReadout(); } });
setInterval(() => {                                  // a pinch whose fingers went silent ends by itself
  if (pinch && silence(now()) > PINCH_TIMEOUT) { pointers.delete(pinch.a); pointers.delete(pinch.b); resetInteraction(); }
}, 500);

document.getElementById('sl-r').addEventListener('input', e => {
  r = parseFloat(e.target.value) / 100;
  updateKatex(); draw();
});
document.getElementById('sl-n').addEventListener('input', e => {
  nIdx = parseInt(e.target.value, 10);
  n    = N_VALUES[nIdx];
  updateKatex(); draw();
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  // proportional to the scroll amount, so trackpads zoom smoothly
  const dy = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1);
  const factor = Math.min(2, Math.max(0.5, Math.exp(dy * 0.0015)));
  xMax = Math.min(XMAX_MAX, Math.max(XMAX_MIN, xMax * factor));
  updateKatex(); draw();
}, { passive: false });

canvas.addEventListener('dblclick', () => {
  xMax = DEFAULT_XMAX;
  updateKatex(); draw();
});

window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
window.addEventListener('resize', () => { setCanvasSize(); updateKatex(); draw(); });

setCanvasSize();
updateKatex();
draw();
</script>
</body>
</html>
